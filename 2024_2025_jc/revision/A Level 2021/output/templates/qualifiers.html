<!DOCTYPE html>
<html>
	<head>
		<title>Qualifiers</title>
	</head>

	<body>
		<h1>Qualifers</h1>

		<table border>
			<tr>
				<th>Name</th>
				<th>Total Score</th>
				<th>Qualified?</th>
			</tr>

			{% for row in data %}
			<tr>
				{% for col in row[:-1] %}
				<td>{{ col }}</td>
				{% endfor %}
				
				<td>
					{% if row[2] == 1 %}
					Yes
					{% else %}
					No
					{% endif %}
				</td>
			</tr>
			{% endfor %}
		</table>
	</body>
</html>
