<!DOCTYPE html>
<html>
	<head>
		<title>Task 4.4</title>
	</head>
	
	<body>
		<h1>Unreturned Books</h1>
		<table border>
			<tr>
				<th>Family Name</th>
				<th>Given Name</th>
				<th>Book Title</th>
			</tr>
			
			{% for row in data %}
			<tr>
				{% for col in row %}
				<td>{{ col }}</td>
				{% endfor %}
			</tr>
			{% endfor %}
		</table>
	</body>
</html>
