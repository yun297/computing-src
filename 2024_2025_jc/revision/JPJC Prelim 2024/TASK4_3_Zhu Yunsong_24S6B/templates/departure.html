<!DOCTYPE>
<html>
	<head><title>Departure</title></head>
	<body>
		<h1>Departure</h1>
		
		<table border>
			<tr>
				<th>Time</th>
				<th>To</th>
				<th>Flight</th>
			</tr>
			
			{% for row in data %}
			<tr>
				{% for col in row %}
				<td>{{ col }}</td>
				{% endfor %}
			</tr>
			{% endfor %}
		</table>
	</body>
</html>
